<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Line 720</title>
<style>:root{--fundo:#f4f5f1;--tinta:#15181c;--suave:#5b626b;--placa:#fff;--borda:#cfd3d0;--sinal:#15181c;--sinal-t:#fff;--ok:#1a7a45;--ok-f:#e2f3e8;--erro:#b3261e;--erro-f:#fbe6e4;--alerta:#f2b705;color-scheme:light}
@media(prefers-color-scheme:dark){:root{--fundo:#14171b;--tinta:#eef0ec;--suave:#a3abb4;--placa:#1e2329;--borda:#39414a;--sinal:#eef0ec;--sinal-t:#14171b;--ok:#6fd398;--ok-f:#173325;--erro:#ff8f86;--erro-f:#3b1d1b;color-scheme:dark}}
*{box-sizing:border-box}
body{margin:0;background:var(--fundo);color:var(--tinta);font:16px/1.5 "Helvetica Neue",Helvetica,Arial,sans-serif}
main{max-width:980px;margin:0 auto;padding:24px 16px 64px}
h1,h2,h3,p{margin:0}
h1{font-size:clamp(40px,8vw,72px);line-height:.95;letter-spacing:-.04em;font-weight:800}
h2{font-size:26px;letter-spacing:-.02em;line-height:1.15}
button,select{font:inherit;color:inherit}
button{cursor:pointer;border:2px solid var(--sinal);background:transparent;border-radius:6px;padding:10px 18px;font-weight:700;min-height:44px}
button.cheio{background:var(--sinal);color:var(--sinal-t)}
button:disabled{opacity:.4;cursor:not-allowed}
button.link{border:0;padding:6px 0;text-decoration:underline;text-underline-offset:3px;font-weight:500;min-height:0}
:focus-visible{outline:3px solid #1667b7;outline-offset:3px}
code{font-family:Consolas,Menlo,monospace;font-size:.92em;background:color-mix(in srgb,var(--tinta) 9%,transparent);padding:1px 5px;border-radius:4px;overflow-wrap:anywhere}
pre{background:color-mix(in srgb,var(--tinta) 8%,transparent);padding:12px;border-radius:6px;overflow-x:auto}pre code{background:none;padding:0}
.suave{color:var(--suave)}.num{font-variant-numeric:tabular-nums}
.hud .fila:first-child{flex-wrap:nowrap}
.fila{display:flex;gap:12px;flex-wrap:wrap;align-items:center}.entre{justify-content:space-between}
.topo{display:grid;grid-template-columns:1fr auto;gap:24px;align-items:end;padding-bottom:20px;border-bottom:6px solid var(--sinal)}
.topo p{margin-top:10px;max-width:46ch}
.nota{text-align:right}.nota b{display:block;font-size:48px;line-height:1;letter-spacing:-.03em}
.painel{margin:20px 0 32px}
select{padding:9px;border-radius:6px;border:2px solid var(--borda);background:var(--placa);min-height:44px;max-width:100%}
.linha{display:grid;grid-template-columns:250px 1fr 56px;gap:16px;align-items:center;padding:14px 0;border-bottom:1px solid var(--borda)}
.linha h3{font-size:17px;line-height:1.2}.linha small{color:var(--suave)}
.via{position:relative;display:flex;justify-content:space-between;align-items:center;min-height:48px;gap:4px}
.via::before{content:"";position:absolute;left:20px;right:20px;height:var(--esp);background:var(--cor);border-radius:99px}
.est{position:relative;width:46px;height:46px;min-height:0;padding:0;border-radius:50%;background:var(--placa);border:5px solid var(--cor);font-size:13px;line-height:1}
.est:disabled{opacity:1;border-color:var(--borda);color:var(--suave)}
.est.feita{background:var(--cor);color:#fff}
.est.prox{box-shadow:0 0 0 4px var(--fundo),0 0 0 7px var(--cor)}
.dom{text-align:right;font-weight:700}
.hud{position:sticky;top:0;background:var(--fundo);padding:12px 0;z-index:2;border-bottom:4px solid var(--cor,var(--sinal));margin-bottom:24px}
.barra{height:16px;border-radius:99px;background:var(--borda);overflow:hidden;margin-top:8px}
.barra i{display:block;height:100%;background:var(--cor,var(--sinal));transition:width .35s}
.barra.cheia i{background:var(--erro)}
.cache{background:var(--alerta);color:#15181c;font-weight:800;padding:2px 10px;border-radius:99px;font-size:14px}
.enun{font-size:20px;line-height:1.45;margin:8px 0 20px;max-width:65ch}
.ops{display:grid;gap:10px;margin-bottom:20px}
div.op{border:2px solid var(--borda);border-radius:6px}
.op{display:flex;gap:12px;text-align:left;align-items:center;font-weight:500;background:var(--placa);border-color:var(--borda);width:100%;padding:13px 16px}
.op:hover:not(:disabled){border-color:var(--tinta)}
.op .k{flex:none;width:26px;height:26px;border:2px solid currentColor;border-radius:50%;display:grid;place-items:center;font-size:13px;font-weight:700}
.op.multi .k{border-radius:5px}
.op.sel{border-color:var(--tinta);box-shadow:inset 0 0 0 1px var(--tinta)}.op.sel .k{background:var(--tinta);color:var(--fundo)}
.op:disabled{opacity:1}.op.fora{opacity:.3;text-decoration:line-through}
.op.certa{border-color:var(--ok);background:var(--ok-f)}.op.errada{border-color:var(--erro);background:var(--erro-f)}
.op .marca{margin-left:auto;font-weight:800;white-space:nowrap}
.mover{margin-left:auto;display:flex;gap:6px}.mover button{padding:0;width:44px}
.porque{padding:18px;border-radius:8px;margin-bottom:20px;background:var(--erro-f)}.porque.ok{background:var(--ok-f)}
.porque h3{margin-bottom:4px}
.brief{background:var(--placa);border:1px solid var(--borda);border-radius:8px;padding:18px 18px 18px 38px;margin:16px 0;display:grid;gap:8px}
.poderes button{border-color:var(--borda);font-family:Consolas,Menlo,monospace;font-size:14px}
.result{font-size:clamp(64px,14vw,120px);line-height:1;font-weight:800;letter-spacing:-.05em}
table{border-collapse:collapse;width:100%;margin:20px 0}td,th{text-align:left;padding:10px 8px;border-bottom:1px solid var(--borda)}td:last-child,th:last-child{text-align:right}
.grade{display:flex;flex-wrap:wrap;gap:5px;margin:20px 0}.grade button{width:40px;min-height:40px;padding:0;font-size:13px;border-color:var(--borda)}
.grade .r{background:var(--sinal);color:var(--sinal-t)}.grade .m{border-color:var(--alerta);border-width:4px}.grade .at{outline:3px solid #1667b7}
.pilha{display:grid;gap:18px;justify-items:start}
footer{margin-top:40px;font-size:14px;color:var(--suave)}
@media(max-width:700px){.linha{grid-template-columns:1fr 56px}.via{grid-column:1/-1;grid-row:2}.topo{grid-template-columns:1fr}.nota{text-align:left}}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}

/* ---------- cena e recompensas ---------- */
#cena{display:block;width:100%;background:#0b1626}#cena[hidden]{display:none}
#cena.mapa{height:clamp(220px,36vh,320px)}#cena.viagem{height:clamp(110px,20vh,170px)}
#fx{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:9}
.garagem{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:10px}
.tremb{display:grid;gap:4px;justify-items:start;text-align:left;background:var(--placa);border-color:var(--borda);padding:12px}
.tremb.sel{border-color:var(--tinta)}.tremb small{font-weight:400;color:var(--suave)}.tremb:disabled .mini{filter:grayscale(1) brightness(.6)}
.mini{width:84px;height:30px;border-radius:6px 20px 5px 6px;border:1px solid #0006;background:linear-gradient(var(--b),var(--b)) 0 22px/100% 5px no-repeat,linear-gradient(90deg,transparent 10px,#ffdf85 10px 26px,transparent 26px 34px,#ffdf85 34px 50px,transparent 50px 58px,#bfe6ff 58px 74px,transparent 74px) 0 6px/100% 10px no-repeat,var(--a)}
.est:not(:disabled):hover{transform:scale(1.14)}.est,button{transition:transform .12s}button:not(:disabled):active{transform:scale(.96)}
.estrelas{font-size:64px;line-height:1;display:flex;gap:8px}.estrelas span{color:var(--borda)}
.estrelas .on{animation:carimbo .4s both;animation-delay:calc(.3s + var(--i)*.38s)}
@keyframes carimbo{0%{transform:scale(2.6);opacity:0;color:#f2b705}70%{transform:scale(.88)}100%{color:#f2b705;opacity:1}}
.pulo{animation:pulo .45s}@keyframes pulo{40%{transform:scale(1.03)}}
.treme{animation:treme .4s}@keyframes treme{20%,60%{transform:translateX(-7px)}40%,80%{transform:translateX(7px)}}
.voa{position:fixed;z-index:10;pointer-events:none;font-weight:800;font-size:26px;color:#f2b705;-webkit-text-stroke:5px #15181c;paint-order:stroke fill;transform:translate(-50%,0);animation:voa 1.1s ease-out both}
.voa.grande{font-size:clamp(40px,9vw,76px);letter-spacing:-.03em}
@keyframes voa{0%{opacity:0;transform:translate(-50%,20px) scale(.6)}20%{opacity:1;transform:translate(-50%,0) scale(1.1)}100%{opacity:0;transform:translate(-50%,-70px)}}
.aviso{position:fixed;z-index:11;top:16px;left:50%;transform:translateX(-50%);pointer-events:none;background:#f2b705;color:#15181c;border-radius:10px;padding:14px 24px;text-align:center;display:grid;min-width:240px;max-width:92vw;animation:desce .35s}
.aviso b{font-size:22px;line-height:1.2}@keyframes desce{from{transform:translate(-50%,-110px)}}
@media(prefers-reduced-motion:reduce){*{animation:none!important}.estrelas .on{color:#f2b705}}
@media(min-height:600px){#cena.viagem{position:sticky;top:0;z-index:3;height:130px}#cena.viagem+main .hud{top:130px}}
@media(min-height:600px) and (max-width:700px){#cena.viagem{height:92px}#cena.viagem+main .hud{top:92px}}

/* ---------- chama, nível, missões ---------- */
.dia{display:grid;grid-template-columns:minmax(0,5fr) minmax(0,7fr);gap:14px;margin-top:22px;width:100%}
.dia .fogo{grid-row:span 1}.dia .missoes{grid-column:1/-1}.dia.fim .nivel:first-child{grid-column:1/-1}
.cartao{background:var(--placa);border:2px solid var(--borda);border-bottom-width:6px;border-radius:18px;padding:18px}
.cartao h2{font-size:22px}.cartao p{font-size:15px}
.fogo{display:grid;gap:12px;align-content:space-between}
.fogo-topo{display:flex;align-items:center;gap:16px}
.fogo-topo b{display:block;font-size:64px;line-height:.9;font-weight:800;letter-spacing:-.04em}.fogo-topo strong{font-size:18px}
.fogo.vivo{background:#ff8a1c;border-color:#c95a00;color:#2b1000}.fogo.rubra{background:#ff6a3d;border-color:#a82c0c}.fogo.azul{background:#5cc0ff;border-color:#1b6fae;color:#04233a}
.fogao{display:grid;place-items:center;width:92px;height:104px;flex:none}
.chama{width:20px;height:25px;overflow:visible;flex:none}.chama.grande{width:84px;height:105px}
.chama path{transform-origin:50% 100%;transform-box:fill-box}
.f1{fill:#e8390b}.f2{fill:#ffab19}.f3{fill:#fff2b0}
.rubra .f1{fill:#b3123f}.rubra .f2{fill:#ff5a1f}.rubra .f3{fill:#ffd34d}
.azul .f1{fill:#0d4fb0}.azul .f2{fill:#2fa8ff}.azul .f3{fill:#e2f6ff}
.apagada .f1{fill:var(--borda)}.apagada .f2{fill:color-mix(in srgb,var(--borda) 70%,var(--fundo))}.apagada .f3{fill:var(--fundo)}
.acesa .f1{animation:lamber 1.1s ease-in-out infinite alternate}.acesa .f2{animation:lamber .8s -.3s ease-in-out infinite alternate-reverse}.acesa .f3{animation:lamber .55s -.2s ease-in-out infinite alternate}
@keyframes lamber{0%{transform:scale(1,.94) skewX(-3deg)}50%{transform:scale(.95,1.05) skewX(2deg)}100%{transform:scale(1.04,1) skewX(4deg)}}
.semana{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:repeat(7,1fr);gap:4px;text-align:center;font-weight:800;font-size:13px}
.semana i{display:grid;place-items:center;aspect-ratio:1;max-width:40px;margin:4px auto 0;border-radius:50%;background:color-mix(in srgb,currentColor 16%,transparent)}
.semana .on i{background:#fff4d6}.semana .chama{width:58%;height:72%}.semana .hoje i{box-shadow:0 0 0 3px currentColor}
.nivel{display:flex;align-items:center;gap:20px}.nivel-txt{flex:1;min-width:0;display:grid;gap:10px}.nivel-txt strong{font-size:34px;line-height:1;letter-spacing:-.03em}
.medalha{width:148px;height:148px;flex:none}.medalha text{font:800 34px "Helvetica Neue",Arial,sans-serif;fill:#3a1c00}
.medalha circle{fill:none;stroke-width:9}.trilha{stroke:var(--borda)}.anel{stroke-linecap:round;transform:rotate(-90deg);transform-origin:center;transition:stroke-dashoffset 1s cubic-bezier(.2,.8,.2,1)}
.medalha.peq{width:64px;height:64px}.medalha.peq text{font-size:38px}
.grossa{position:relative;height:26px;border-radius:99px;background:var(--borda);overflow:hidden}
.grossa i{position:relative;display:block;height:100%;border-radius:99px;background:var(--b1,#f2b705);transition:width 1s cubic-bezier(.2,.8,.2,1)}
.grossa i::after{content:"";position:absolute;left:10px;right:10px;top:5px;height:5px;border-radius:9px;background:#fff6}
.grossa em{position:absolute;inset:0;display:grid;place-items:center;font-style:normal;font-weight:800;font-size:14px;color:#fff;text-shadow:0 0 3px #000,0 0 3px #000,0 1px 2px #000}
.prox{display:flex;align-items:center;gap:10px;color:var(--suave)}
.missoes header{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:4px}.missoes header span{font-weight:800;color:var(--suave)}
.mis{--b1:#1e9bf0;display:grid;grid-template-columns:60px 1fr 64px;gap:16px;align-items:center;padding:14px 0;border-top:2px solid var(--borda)}
.mis:first-of-type{border-top:0}.mis.c{--b1:#f2a900}.mis.v{--b1:#e8552f}
.mis strong{display:block;margin-bottom:6px;font-size:17px}
.ico{width:60px;height:60px;padding:11px;border-radius:16px;background:var(--b1);fill:#fff}.ico .c{fill:var(--b1)}
.premio{display:grid;place-items:center;width:60px;height:60px;border-radius:16px;border:3px dashed var(--borda);line-height:1;color:var(--suave)}
.premio b{font-size:19px;color:var(--tinta)}.premio small{font-size:11px;font-weight:800}
.mis.feita{--b1:#2fa84f}.feita .premio{border:0;border-radius:50%;background:#2fa84f}.premio svg{width:38px;height:38px;fill:none;stroke:#fff;stroke-width:7;stroke-linecap:round;stroke-linejoin:round}
.mis.nova .premio{animation:carimbo2 .5s 1.25s both}@keyframes carimbo2{0%{transform:scale(2.4);opacity:0}70%{transform:scale(.85)}100%{transform:scale(1);opacity:1}}
.mini-status{display:flex;align-items:center;gap:12px}.ms-fogo{display:flex;align-items:center;gap:5px;font-size:30px}.ms-fogo .chama{width:38px;height:48px}
.fogo-fx{position:fixed;inset:0;z-index:12;pointer-events:none;display:grid;place-content:center;justify-items:center;text-align:center;background:#0b1626d9;color:#fff;animation:some 1.9s both}
.fogo-fx .chama{width:150px;height:188px;animation:carimbo2 .5s both}.fogo-fx b{font-size:96px;line-height:1;font-weight:800}.fogo-fx span{font-size:24px;font-weight:800}
@keyframes some{0%{opacity:0}10%,82%{opacity:1}100%{opacity:0}}
@media(max-width:700px){.dia{grid-template-columns:minmax(0,1fr)}.medalha:not(.peq){width:112px;height:112px}.nivel{gap:14px}.nivel-txt strong{font-size:28px}.mis{grid-template-columns:48px 1fr 52px;gap:12px}.ico{width:48px;height:48px;padding:9px}.premio{width:50px;height:50px}.mis strong{font-size:15px}}
@media(prefers-reduced-motion:reduce){.fogo-fx{background:#0b1626}}

/* ---------- idioma e metrô ---------- */
.lado{display:grid;gap:18px;justify-items:end}
.idioma{display:inline-flex;border:2px solid var(--sinal);border-radius:99px;overflow:hidden}
.idioma button{border:0;border-radius:0;padding:8px 16px;font-weight:500}.idioma b{margin-right:4px}
.idioma [aria-pressed=true]{background:var(--sinal);color:var(--sinal-t)}
.metro{position:relative;margin-top:28px;border-radius:22px;overflow:hidden;background:#0f2130;border:2px solid #24425a;border-bottom-width:6px;color:#eef4f7}
.vias{position:absolute;inset:0;width:100%;height:100%}.vias path{fill:none;stroke-linecap:round;stroke-linejoin:round}
.vias .rio{stroke:#173a52;stroke-width:64}.vias .quadra{fill:#14293a}
.apag{opacity:.55}.luz{filter:drop-shadow(0 0 7px #ffffff66) brightness(1.25)}
.vias .fluxo{stroke:#fff;stroke-opacity:.75;stroke-dasharray:3 24;animation:fluxo 1.1s linear infinite}@keyframes fluxo{to{stroke-dashoffset:-27}}
.rotulo{position:absolute;display:flex;align-items:center;gap:9px;line-height:1.15;font-size:15px}
.rotulo b{flex:none;width:28px;height:28px;border-radius:8px;display:grid;place-items:center;background:var(--cor);color:#fff;box-shadow:0 0 0 2px #fff3}
.rotulo span{color:#a9bdca;font-size:13px;white-space:nowrap}.rotulo em{font-style:normal;font-weight:800;background:#ffffff1c;border-radius:99px;padding:2px 9px;font-size:13px}
.pt{position:absolute;width:56px;height:56px;min-height:0;padding:0;margin:-28px 0 0 -28px;border-radius:50%;background:#f4f8fa;border:6px solid var(--cor);color:#12202b;box-shadow:0 5px 0 #0007,0 0 0 3px #0f2130;display:grid;place-items:center;font-size:20px;font-weight:800;line-height:1}
.pt svg{width:24px;height:24px;fill:currentColor;display:block}
.pt.feita{background:var(--cor);border-color:#fff;color:#fff}
.pt.trava:disabled{opacity:1;background:#22394b;border-color:#3a566b;color:#8aa3b4;cursor:not-allowed}.pt.trava svg{width:20px;height:20px}
.pt.prox{background:#ffc928;border-color:#fff;color:#3a2200;animation:salto 1.3s ease-in-out infinite}
.pt.prox::after{content:"";position:absolute;inset:-14px;border-radius:50%;border:4px solid #ffc928;animation:onda 1.6s ease-out infinite;pointer-events:none}
.pt:not(:disabled):hover{filter:brightness(1.1)}.pt:not(:disabled):active{transform:translateY(4px);box-shadow:0 1px 0 #0007,0 0 0 3px #0f2130}
.pt small{position:absolute;top:100%;left:50%;transform:translateX(-50%);margin-top:5px;display:flex;font-size:17px;line-height:1}.pt small i{font-style:normal;color:#3a566b}.pt small .on{color:#ffc928;text-shadow:0 0 8px #ffc92899}
@keyframes salto{50%{translate:0 -5px}}@keyframes onda{0%{transform:scale(.75);opacity:.9}100%{transform:scale(1.25);opacity:0}}
.terminal{position:absolute;left:16px;right:8px;display:flex;align-items:center;gap:22px;padding:16px 20px;border-radius:18px;background:#1b3a50;border:4px solid #ffc928}
.terminal .t720{font-size:clamp(44px,8vw,76px);font-weight:800;letter-spacing:-.05em;line-height:.9;color:#ffc928}.terminal.cheio .t720{text-shadow:0 0 24px #ffc928}
.t-info{flex:1;min-width:0;display:grid;gap:8px;font-size:18px}.terminal .grossa{background:#0f2130}
.terminal button{background:#ffc928;border-color:#ffc928;color:#2d1b00;box-shadow:0 5px 0 #a87b00;white-space:nowrap}
@media(max-width:700px){.lado{justify-items:start}.pt{width:40px;height:40px;margin:-20px 0 0 -20px;border-width:4px}.rotulo{font-size:14px;gap:7px}.rotulo span{display:none}.terminal{flex-wrap:wrap;gap:12px}.terminal button{width:100%}.pt small{font-size:14px}}
@media(prefers-reduced-motion:reduce){.vias .fluxo,.pt.prox,.pt.prox::after{animation:none}}
</style>
</head>

<script type="application/json" id="dados">{"dominios":[{"id":"agents","nome":"Agents and Workflows","cor":"#d4502f","briefing":["Comece pelo mais simples: uma chamada, depois workflow, só então agent.","Workflow = caminho definido por código. Agent = modelo decide os próximos passos.","O loop: enquanto `stop_reason` for `tool_use`, execute e devolva `tool_result`.","Subagents isolam contexto; devolva ao pai só a conclusão.","Regra que precisa valer sempre vai em hook ou código, não em prompt."]},{"id":"apps","nome":"Applications and Integration","cor":"#1667b7","briefing":["Por padrão, a Messages API é stateless: você reenvia o histórico.","Confira `stop_reason` antes de usar o conteúdo.","429 = rate limit, 529 = sobrecarga: backoff com jitter e respeito a `retry-after`. 400 não se resolve com retry.","Batch: assíncrono, até 24 h, metade do preço, resultados em qualquer ordem.","Fixe versões de modelo e versione prompts como código."]},{"id":"code","nome":"Claude Code","cor":"#7a4fa3","briefing":["`CLAUDE.md` = contexto persistente; `settings.json` = configuração aplicada pelo harness.","Skill: procedimento carregado sob demanda. Subagent: contexto separado. Hook: ação determinística. Plugin: pacote distribuível.","`claude -p` roda sem interface, útil em CI.","`/clear` zera a conversa; `/compact` a resume."]},{"id":"eval","nome":"Eval, Testing, and Debugging","cor":"#16806a","briefing":["Defina sucesso mensurável antes de mexer no prompt.","Prefira graders em código; use LLM-as-judge para o subjetivo e calibre contra humanos.","Leia traces para separar falha da integração de falha do modelo.","Cada bug de produção vira um caso de regressão."]},{"id":"model","nome":"Model Selection and Optimization","cor":"#b8860b","briefing":["Escolha pelo eval: o modelo mais barato que atende à qualidade.","Cache é por prefixo: conteúdo estável primeiro, volátil no fim.","Ordem do prefixo: `tools` → `system` → `messages`.","Effort ajusta profundidade e gasto; `max_tokens` é teto rígido.","Meça custo por tarefa concluída, não por requisição."]},{"id":"prompt","nome":"Prompt and Context Engineering","cor":"#c23a78","briefing":["Seja claro e direto; explique o porquê das restrições.","Separe instruções de dados, por exemplo com tags XML.","Documento longo primeiro, pergunta no fim.","Contexto é recurso finito: pode, compacte e isole.","Valide toda saída; JSON válido ainda pode estar errado."]},{"id":"sec","nome":"Security and Safety","cor":"#4a5a6a","briefing":["Conteúdo de web, e-mail, arquivo ou tool é dado não confiável.","Prompt não é controle de acesso: autorize em código.","Menor privilégio e defesa em camadas.","Segredos fora de prompts, código e logs.","Hooks `PreToolUse` podem bloquear antes da execução."]},{"id":"tools","nome":"Tools and MCPs","cor":"#00838f","briefing":["A descrição da tool é prompt: diga o que faz, quando usar e quando não.","Client tool: você executa. Server tool: a Anthropic executa.","MCP padroniza integrações reutilizáveis; Skill ensina um procedimento.","MCP expõe tools, resources e prompts; transportes: stdio e Streamable HTTP.","Muitas tools: menos sobreposição e carregamento sob demanda."]}],"questoes":[{"id":"agents-01","dominio":"agents","tipo":"unica","skill":"Agent Architecture","texto":"Um sistema recebe faturas sempre no mesmo formato, extrai 6 campos, valida e grava. Os passos nunca mudam. Qual arquitetura escolher?","ops":["Workflow em código com chamadas a Claude nos passos de extração","Agent autônomo com acesso ao banco e liberdade para planejar passos","Manager com um subagent dedicado a cada campo da fatura","Agent com memória persistente para lembrar faturas anteriores"],"certas":[0],"porque":"Passos previsíveis pedem workflow: mais barato, testável e previsível. Agents compensam quando o caminho não pode ser especificado antes."},{"id":"agents-02","dominio":"agents","tipo":"multipla","skill":"Agent Architecture","texto":"Quais condições favorecem um **agent** em vez de um workflow? (Escolha 2)","ops":["O número e a ordem dos passos dependem do que for descoberto","Erros podem ser detectados e corrigidos, por exemplo com testes","A latência precisa ser mínima e constante em cada pedido","A tarefa é uma classificação simples em cinco categorias"],"certas":[0,1],"porque":"Agents trocam custo e latência por flexibilidade. Precisam de complexidade, valor, viabilidade e erros recuperáveis."},{"id":"agents-03","dominio":"agents","tipo":"ordem","skill":"Agent Patterns and Frameworks","texto":"Ordene uma volta do loop manual de tool use.","ops":["Enviar mensagens e definições de tools para a API","Receber resposta com `stop_reason: \"tool_use\"`","Adicionar a resposta completa do assistant ao histórico","Executar as tools pedidas no seu ambiente","Enviar os blocos `tool_result` em uma mensagem user"],"certas":[0,1,2,3,4],"porque":"O conteúdo completo do assistant precisa entrar no histórico antes dos resultados, para os `tool_use_id` casarem."},{"id":"agents-04","dominio":"agents","tipo":"unica","skill":"Agent Patterns and Frameworks","texto":"Uma pesquisa em 40 arquivos enche o contexto do agent principal, que esquece o objetivo. Qual mudança ataca a causa?","ops":["Delegar a leitura a subagents que devolvem apenas as conclusões","Repetir o objetivo em letras maiúsculas no system prompt","Elevar `max_tokens` para dar mais espaço às respostas","Pedir que o agent principal leia os arquivos em ordem alfabética"],"certas":[0],"porque":"Subagents têm contexto próprio. O conteúdo bruto fica neles e o pai recebe só o resumo."},{"id":"agents-05","dominio":"agents","tipo":"unica","skill":"Agent Construction with Claude","texto":"A equipe quer um agent que leia, edite arquivos e rode comandos **na própria infraestrutura**, com loop, permissões e subagents prontos. O que usar?","ops":["Claude Agent SDK","Message Batches API","Managed Agents em nuvem da Anthropic","Token counting API"],"certas":[0],"porque":"O Agent SDK empacota o harness do Claude Code e você hospeda. Managed Agents roda o loop no lado da Anthropic."},{"id":"agents-06","dominio":"agents","tipo":"unica","skill":"Agent Construction with Claude","texto":"Qual é a diferença entre o **Tool Runner** do SDK da API e o **Claude Agent SDK**?","ops":["O Tool Runner automatiza o loop das tools que você define; o Agent SDK traz tools e harness prontos","O Tool Runner roda em sandbox na nuvem da Anthropic; o Agent SDK só funciona com Message Batches assíncronos","O Tool Runner serve só para MCP; o Agent SDK não aceita MCP","São o mesmo pacote com nomes diferentes em Python e TypeScript"],"certas":[0],"porque":"Ambos são hospedados por você. Muda o escopo: loop fino sobre suas funções ou harness completo."},{"id":"agents-07","dominio":"agents","tipo":"unica","skill":"Agent Construction with Claude","texto":"Todo arquivo editado pelo agent precisa passar pelo formatter, sem exceção. Onde colocar a regra?","ops":["Em um hook executado após a edição","No fim do system prompt, marcada como importante","Em um exemplo few-shot com código formatado","Na descrição da tool de edição de arquivos"],"certas":[0],"porque":"Hooks do tipo command rodam sempre que o evento ocorre. Instruções em prompt são seguidas na maioria das vezes, não garantidas."},{"id":"agents-08","dominio":"agents","tipo":"unica","skill":"Agent Architecture","texto":"Um pipeline recebe tickets e envia cada um ao prompt especializado: cobrança, técnico ou vendas. Qual padrão é esse?","ops":["Routing","Prompt chaining","Evaluator-optimizer","Parallel voting"],"certas":[0],"porque":"Routing classifica a entrada e encaminha ao tratamento adequado."},{"id":"agents-09","dominio":"agents","tipo":"unica","skill":"Agent Architecture","texto":"Um modelo gera traduções, outro critica com critérios claros, e o ciclo repete até aprovar. Qual padrão é esse?","ops":["Evaluator-optimizer","Routing","Orchestrator-workers","Sectioning paralelo"],"certas":[0],"porque":"Funciona quando há critérios claros e a iteração melhora o resultado de forma mensurável."},{"id":"agents-10","dominio":"agents","tipo":"unica","skill":"Agent Patterns and Frameworks","texto":"Claude devolve três blocos `tool_use` na mesma resposta. Como responder?","ops":["Com três `tool_result` juntos em uma única mensagem user","Com três mensagens user separadas, uma para cada resultado","Com apenas o primeiro resultado, esperando novos pedidos","Com os três resultados unidos em um texto sem identificadores"],"certas":[0],"porque":"Cada resultado referencia seu `tool_use_id`, todos na mesma mensagem. Separar desestimula chamadas paralelas."},{"id":"agents-11","dominio":"agents","tipo":"unica","skill":"Agent Construction with Claude","texto":"Um time quer agent de longa duração sem hospedar loop nem sandbox, com sessões persistidas pelo provedor. Qual opção encaixa?","ops":["Managed Agents","Loop manual na Messages API","Tool Runner em um servidor próprio","Agent SDK em contêiner próprio"],"certas":[0],"porque":"Em Managed Agents a Anthropic executa o loop e persiste as sessões; o sandbox pode ser na nuvem dela (o caso aqui) ou self-hosted. As demais são hospedadas por você."},{"id":"agents-12","dominio":"agents","tipo":"multipla","skill":"Agent Patterns and Frameworks","texto":"Seu agent às vezes entra em loop infinito. Quais controles o **harness** deve ter? (Escolha 2)","ops":["Limite de iterações ou orçamento por execução","Detecção de chamadas repetidas sem progresso","Remoção de todos os erros devolvidos pelas tools","Contexto vazio a cada nova iteração do loop"],"certas":[0,1],"porque":"Limites ficam no código. Esconder erros impede a recuperação e zerar o contexto elimina o progresso."},{"id":"agents-13","dominio":"agents","tipo":"unica","skill":"Agent Patterns and Frameworks","texto":"Um agent precisa retomar o trabalho amanhã, em uma sessão nova. O que funciona melhor?","ops":["Registrar estado e próximos passos em armazenamento persistente","Reabrir com o mesmo modelo, que ainda lembrará da conversa anterior","Aumentar o effort antes de encerrar a sessão","Guardar o progresso no cache de prompt"],"certas":[0],"porque":"A API é stateless e o cache expira. Estado durável precisa de arquivo, banco ou memory tool."},{"id":"agents-14","dominio":"agents","tipo":"unica","skill":"Agent Architecture","texto":"Em uma estrutura supervisor/workers, qual briefing tende a funcionar melhor para um worker?","ops":["Objetivo, limites, contexto necessário e formato esperado do retorno","O histórico completo do supervisor sem nenhuma instrução nova","Uma frase curta, deixando o worker inferir todo o contexto","A lista completa dos outros workers e todos os seus resultados parciais"],"certas":[0],"porque":"O worker não vê o contexto do pai. Precisa de um briefing autossuficiente, sem despejar tudo."},{"id":"agents-15","dominio":"agents","tipo":"unica","skill":"Agent Construction with Claude","texto":"Uma tool falha por timeout. O que o loop deve devolver ao modelo?","ops":["`tool_result` com `is_error: true` e uma mensagem útil","Nada para esta chamada, seguindo para a próxima chamada pendente","`tool_result` vazio como se tivesse dado certo","Uma nova conversa sem a chamada que falhou"],"certas":[0],"porque":"Todo `tool_use` precisa de resultado. Um erro informativo permite tentar de novo ou mudar de plano."},{"id":"agents-16","dominio":"agents","tipo":"unica","skill":"Agent Patterns and Frameworks","texto":"Um agent de viagens usa três workers: voos, hotéis e vistos. Cada um devolve sua parte. O que cabe ao **supervisor**?","ops":["Refazer cada busca para confirmar o trabalho dos workers","Treinar os workers com os erros de cada conversa","Dividir o pedido, delegar e juntar as partes","Repassar ao usuário as três respostas, sem alterações"],"certas":[2],"porque":"O supervisor decompõe, encaminha e consolida; inclusive resolve conflitos entre as partes."},{"id":"agents-17","dominio":"agents","tipo":"unica","skill":"Agent Construction with Claude","texto":"Um agent noturno no **Claude Agent SDK** não pode passar de 30 turnos nem de US$ 2. Como impor isso e saber que o limite foi atingido?","ops":["Definir `max_turns` e `max_budget_usd` e ler o `subtype` do resultado","Pedir no prompt que pare em 30 turnos e procurar \"FIM\" no texto","Confiar no limite padrão de turnos que o SDK aplica a todo agent","Reduzir `max_tokens` até o loop terminar por falta de saída"],"certas":[0],"porque":"Por padrão o SDK não limita turnos nem custo. Ao bater no limite, o resultado traz `error_max_turns` ou `error_max_budget_usd`. O custo é estimado e pode passar um pouco do teto. Em `query()` de disparo único, uma exceção vem depois desse resultado: trate-a."},{"id":"agents-18","dominio":"agents","tipo":"unica","skill":"Agent Construction with Claude","texto":"Ao escolher **Managed Agents** em vez de hospedar o próprio loop, de qual vantagem você abre mão?","ops":["Da possibilidade de usar tools personalizadas","De parte do controle sobre o runtime e o ambiente","Da execução de tarefas com mais de um turno","Do uso de servidores MCP pelo agent"],"certas":[1],"porque":"A troca é controle por menos operação: o harness vem pronto e, no padrão em nuvem, o provedor também cuida do sandbox. Há opções auto-hospedadas."},{"id":"agents-19","dominio":"agents","tipo":"unica","skill":"Agent Patterns and Frameworks","texto":"Um tutor lembra o nível de cada aluno entre sessões. Hoje ele reenvia **todas** as conversas passadas e o custo explodiu. Qual desenho é melhor?","ops":["Reenviar só as conversas em que o aluno tirou boas notas","Aumentar `max_tokens` para caber mais histórico","Deixar o modelo deduzir o nível a cada nova sessão","Guardar fatos em memória externa e carregar os relevantes"],"certas":[3],"porque":"Memória durável fica fora do modelo; no contexto entra só o que a sessão precisa."},{"id":"agents-20","dominio":"agents","tipo":"multipla","skill":"Agent Architecture","texto":"Três análises independentes do mesmo contrato (fiscal, trabalhista, privacidade) rodam em sequência. Quais afirmações sobre **paralelizar** são corretas? (Escolha 2)","ops":["A latência total se aproxima da análise mais lenta","O custo em tokens cai para um terço do original","As análises passam a ver as conclusões umas das outras","É preciso uma etapa que consolide os três resultados"],"certas":[0,3],"porque":"Paralelizar corta tempo, não tokens, e exige uma etapa de agregação. Só serve quando as partes não dependem entre si."},{"id":"agents-21","dominio":"agents","tipo":"unica","skill":"Agent Architecture","texto":"Um relatório passa sempre por: esboço, checagem automática, redação. Se a checagem reprova, o fluxo para. Qual padrão é esse?","ops":["Agent autônomo com memória","Votação entre modelos","Routing por categoria","Prompt chaining com gate"],"certas":[3],"porque":"Etapas fixas encadeadas, com verificação em código entre elas."},{"id":"agents-22","dominio":"agents","tipo":"unica","skill":"Agent Architecture","texto":"Três chamadas iguais analisam o mesmo código, e um alerta é aceito se duas o apontarem. Qual padrão?","ops":["Orchestrator-workers","Prompt chaining","Votação (paralelização)","Evaluator-optimizer"],"certas":[2],"porque":"Rodar a mesma tarefa várias vezes e agregar aumenta a confiança, a um custo maior."},{"id":"agents-23","dominio":"agents","tipo":"unica","skill":"Agent Architecture","texto":"Em que caso **orchestrator-workers** é melhor que paralelização fixa?","ops":["A resposta precisa sair com a menor latência possível","As subtarefas só são conhecidas em tempo de execução","As subtarefas são sempre as mesmas e independentes","A tarefa cabe com folga em uma única chamada simples"],"certas":[1],"porque":"O orquestrador decide a divisão conforme a entrada. Se a divisão é fixa, código basta."},{"id":"agents-24","dominio":"agents","tipo":"unica","skill":"Agent Architecture","texto":"Um time quer um agent para converter CSV em JSON. Qual é a melhor recomendação?","ops":["Código comum, sem LLM","Agent com tool de arquivos","Workflow com três prompts","Dois agents que se revisam"],"certas":[0],"porque":"Transformação determinística não pede modelo: código é mais barato e exato."},{"id":"agents-25","dominio":"agents","tipo":"multipla","skill":"Agent Architecture","texto":"Antes de dar autonomia a um agent, quais perguntas são decisivas? (Escolha 2)","ops":["Dá para verificar o resultado?","O modelo é o mais recente?","Há pelo menos cinco tools?","Qual é o custo de um erro?"],"certas":[0,3],"porque":"Autonomia compensa quando o erro é barato ou reversível e há como verificar."},{"id":"agents-26","dominio":"agents","tipo":"unica","skill":"Agent Architecture","texto":"Dois subagents editam o **mesmo** arquivo em paralelo e um apaga o trabalho do outro. Como prevenir?","ops":["Aumentar o contexto disponível para ambos","Trocar o modelo do segundo subagent","Dividir por arquivos ou isolar em worktrees","Pedir que os dois trabalhem com cuidado"],"certas":[2],"porque":"Paralelize só o que não compartilha estado, ou isole e integre depois."},{"id":"agents-27","dominio":"agents","tipo":"unica","skill":"Agent Architecture","texto":"Um sistema multi-agent gasta muito mais tokens que um agent único. Quando isso se justifica?","ops":["Tarefa em que todos precisam do mesmo contexto","Tarefa valiosa, ampla e divisível em partes","Tarefa curta, com passos que dependem entre si","Tarefa simples, repetida milhões de vezes ao dia"],"certas":[1],"porque":"Multi-agent brilha em exploração paralela de alto valor; dependências fortes o atrapalham."},{"id":"agents-28","dominio":"agents","tipo":"unica","skill":"Agent Architecture","texto":"O que diferencia **handoff** de **delegação** entre agents?","ops":["No handoff, o outro agent assume a conversa","No handoff, o outro agent só devolve um resumo","Na delegação, o histórico é sempre apagado","Na delegação, o usuário troca de aplicativo"],"certas":[0],"porque":"Na delegação o agent principal mantém o controle e recebe o resultado."},{"id":"agents-29","dominio":"agents","tipo":"unica","skill":"Agent Patterns and Frameworks","texto":"Qual condição encerra normalmente o loop de um agent feito à mão com a Messages API?","ops":["O texto da resposta conter a palavra \"pronto\"","A resposta trazer menos de cem tokens de saída","O modelo devolver dois blocos de texto seguidos","`stop_reason` igual a `end_turn`, sem tool pendente"],"certas":[3],"porque":"`tool_use` e `pause_turn` pedem outra volta. `max_tokens` e `refusal` também param o loop, mas não são término normal: trate cada um."},{"id":"agents-30","dominio":"agents","tipo":"unica","skill":"Agent Patterns and Frameworks","texto":"Um agent repete a mesma busca falha dez vezes. Além de limitar, o que ajuda o modelo a mudar de rumo?","ops":["Um prompt que proíba qualquer nova busca","Um número maior de tokens de saída por turno","Um resultado que explique a falha e as opções","Um resultado vazio para ele perceber sozinho"],"certas":[2],"porque":"O resultado da tool é a principal evidência que ele tem do ambiente."},{"id":"agents-31","dominio":"agents","tipo":"unica","skill":"Agent Patterns and Frameworks","texto":"Em uma tarefa de 6 horas, o agent marca itens como feitos sem testar. Qual mudança ataca isso?","ops":["Encurtar a lista para parecer mais realizável","Exigir verificação executável antes de concluir","Aumentar o número de itens da lista de tarefas","Pedir que o agent escreva com mais confiança"],"certas":[1],"porque":"Testes ou checagens que o harness executa valem mais que autoavaliação."},{"id":"agents-32","dominio":"agents","tipo":"unica","skill":"Agent Patterns and Frameworks","texto":"O que deve ir em um arquivo de progresso para que **outra sessão** continue o trabalho?","ops":["Decisões, estado atual e próximos passos","A transcrição inteira de todas as mensagens","Só a lista das ferramentas disponíveis","O conteúdo completo dos arquivos lidos"],"certas":[0],"porque":"Boas notas de passagem são curtas e acionáveis; o resto pode ser relido sob demanda."},{"id":"agents-33","dominio":"agents","tipo":"unica","skill":"Agent Patterns and Frameworks","texto":"Um subagent devolve 30 mil tokens de log ao agent principal. Qual é o problema?","ops":["Impede o uso de streaming no agent principal","Faz o subagent perder as próprias tools","Obriga o principal a trocar de modelo","Anula o isolamento de contexto que se buscava"],"certas":[3],"porque":"Peça conclusões com referências; o detalhe fica no contexto descartável."},{"id":"agents-34","dominio":"agents","tipo":"multipla","skill":"Agent Patterns and Frameworks","texto":"Quais informações um subagent com contexto novo **não** tem, a menos que você passe? (Escolha 2)","ops":["As tools que foram liberadas para ele","O próprio system prompt dele","As decisões tomadas na conversa principal","O formato em que você quer o resultado"],"certas":[2,3],"porque":"Contexto isolado é via de mão dupla: o briefing precisa ser completo."},{"id":"agents-35","dominio":"agents","tipo":"unica","skill":"Agent Patterns and Frameworks","texto":"Um agent faz 40 chamadas em sequência para somar valores de 40 arquivos. O que é mais eficiente?","ops":["Elevar o limite de turnos para oitenta","Dar a ele execução de código para agregar","Pedir que ele some de cabeça no final","Dividir a soma entre quarenta subagents"],"certas":[1],"porque":"Código processa os dados fora do contexto e devolve só o total, com exatidão."},{"id":"agents-36","dominio":"agents","tipo":"unica","skill":"Agent Construction with Claude","texto":"Um protótipo precisa de **duas** tools próprias e um loop simples, em Python. O que evita escrever o loop à mão?","ops":["Tool Runner do SDK","Message Batches API","Um servidor MCP remoto","Um plugin do Claude Code"],"certas":[0],"porque":"O Tool Runner executa suas funções e repete até o fim do turno."},{"id":"agents-37","dominio":"agents","tipo":"unica","skill":"Agent Construction with Claude","texto":"Em Managed Agents, qual é a diferença entre **agent** e **session**?","ops":["Agent é uma execução; session é só o seu histórico","Agent é o modelo; session é a chave de acesso","Agent é o sandbox; session é o arquivo de saída","Agent é a configuração; session é uma execução dela"],"certas":[3],"porque":"A configuração é reutilizável e versionada; cada sessão roda a partir dela."},{"id":"agents-38","dominio":"agents","tipo":"unica","skill":"Agent Construction with Claude","texto":"Arquivos regulados e a execução de comandos devem ficar na sua rede; só trechos aprovados podem ir ao modelo. Qual desenho considerar?","ops":["Enviar os dados só por streaming","Usar um modelo menor na nuvem pública","Executar as tools na sua infraestrutura","Aumentar o effort no sandbox hospedado"],"certas":[2],"porque":"Com as tools na sua infraestrutura, arquivos e execução ficam na rede. Mas o resultado devolvido ao modelo sai dela: filtre-o."},{"id":"agents-39","dominio":"agents","tipo":"unica","skill":"Agent Construction with Claude","texto":"No Claude Agent SDK, um app sem humano no terminal precisa decidir sobre ações **não** pré-aprovadas. O que usar?","ops":["Um `max_tokens` menor em cada turno","Um callback de permissão da aplicação","Um prompt pedindo bom senso ao agent","Uma lista maior de exemplos few-shot"],"certas":[1],"porque":"O código da aplicação decide, com contexto e auditoria, em vez de aceitar tudo."},{"id":"agents-40","dominio":"agents","tipo":"unica","skill":"Agent Construction with Claude","texto":"Um agent de suporte precisa **escalar** para um humano. Como implementar de forma confiável?","ops":["Uma tool de escalonamento com critérios claros","Uma frase combinada que o atendente procura","Um limite de palavras por resposta do agent","Uma nota de confiança que o modelo inventa"],"certas":[0],"porque":"Uma tool torna a escalada um evento estruturado que o sistema trata; reforce casos obrigatórios em código."},{"id":"agents-41","dominio":"agents","tipo":"multipla","skill":"Agent Construction with Claude","texto":"Quais itens pertencem ao **harness**, e não ao modelo? (Escolha 2)","ops":["Aplicar limites de custo","Escolher a próxima palavra","Interpretar o pedido do usuário","Executar as tools"],"certas":[0,3],"porque":"O modelo propõe; o harness executa, limita, registra e controla permissões."},{"id":"agents-42","dominio":"agents","tipo":"unica","skill":"Agent Construction with Claude","texto":"Um agent de longa duração deve sobreviver à queda do processo. O que o desenho precisa ter?","ops":["Uma janela de contexto maior para o agent","Um único turno longo com toda a tarefa","Estado salvo fora do processo e passos retomáveis","Um prompt que peça para não parar de executar"],"certas":[2],"porque":"Persistência e idempotência permitem retomar sem repetir efeitos."},{"id":"agents-43","dominio":"agents","tipo":"unica","skill":"Agent Construction with Claude","texto":"Um agent precisa de credencial de produção para uma API. Onde ela **não** deve aparecer?","ops":["No proxy que injeta o header","No contexto do modelo","No secret manager","No serviço que executa a tool"],"certas":[1],"porque":"A tool ou um proxy usa a credencial; o modelo não precisa vê-la."},{"id":"agents-44","dominio":"agents","tipo":"unica","skill":"Agent Construction with Claude","texto":"Ao testar um agent, por que simular tools com falhas e lentidão?","ops":["Para ver se ele se recupera ou age errado","Para reduzir o preço por token do modelo","Para treinar o modelo com os erros vistos","Para aumentar a taxa de acerto do cache"],"certas":[0],"porque":"O caminho feliz não revela como o agent lida com erros, que são comuns em produção."},{"id":"agents-45","dominio":"agents","tipo":"unica","skill":"Agent Construction with Claude","texto":"Um agent recebe 15 documentos e deve citar a origem de cada afirmação. O que o harness deve preservar?","ops":["Um resumo único dos quinze documentos","Só o texto, sem metadados que gastem tokens","A data em que cada documento foi lido","O identificador da fonte junto de cada trecho"],"certas":[3],"porque":"Sem a proveniência no contexto, não há como citar ou auditar."},{"id":"apps-01","dominio":"apps","tipo":"unica","skill":"Claude API Mechanics","texto":"Um chat \"esquece\" o que o usuário disse no turno anterior. O código envia só a última mensagem. Qual a correção?","ops":["Reenviar o histórico de mensagens em cada requisição","Definir o mesmo `user_id` em todas as requisições do chat","Ativar streaming para manter a conexão aberta","Aumentar `max_tokens` para guardar mais turnos"],"certas":[0],"porque":"Por padrão, a Messages API é stateless: o contexto é o que você envia. Message threads (beta) guarda a conversa por pouco tempo, mas a aplicação ainda precisa manter sua cópia."},{"id":"apps-02","dominio":"apps","tipo":"unica","skill":"Claude API Mechanics","texto":"A API retorna 429 com o header `retry-after`. Qual é a reação correta?","ops":["Aguardar o tempo indicado e repetir com backoff","Repetir na hora, em paralelo, até alguma passar","Trocar a API key e repetir a requisição","Descartar a requisição como inválida"],"certas":[0],"porque":"429 é rate limit. Respeite `retry-after` e use backoff com jitter. Os SDKs já repetem algumas vezes."},{"id":"apps-03","dominio":"apps","tipo":"multipla","skill":"Claude API Mechanics","texto":"Quais erros normalmente **não** se resolvem repetindo a mesma requisição? (Escolha 2)","ops":["400 `invalid_request_error`","401 `authentication_error`","429 `rate_limit_error`","529 `overloaded_error`"],"certas":[0,1],"porque":"400 e 401 exigem corrigir pedido ou credencial. 429 e 529 são transitórios."},{"id":"apps-04","dominio":"apps","tipo":"unica","skill":"Claude API Mechanics","texto":"O JSON da resposta vem cortado no meio e `stop_reason` é `max_tokens`. O que aconteceu?","ops":["A saída atingiu o limite definido na requisição","O modelo concluiu a resposta e omitiu o fechamento","O rate limit interrompeu a geração","A chave da API expirou durante a chamada"],"certas":[0],"porque":"Em `max_tokens` a resposta está truncada. Aumente o limite ou reduza o pedido; xto parcial como resposta final, já que houve HTTP 200","Assumir `end_turn`, pois houve texto","Executar tools com o JSON parcial recebido"],"certas":[0],"porque":"HTTP 200 só indica que o stream começou. Sem o evento final, a resposta é parcial; nunca execute input incompleto."},{"id":"apps-10","dominio":"apps","tipo":"unica","skill":"Claude API Mechanics","texto":"O mesmo PDF é usado em dezenas de requisições. Como evitar reenviar os bytes?","ops":["Subir pela Files API e referenciar o `file_id`","Converter em base64 e comprimir a cada requisição","Colar o nome do arquivo no prompt","Guardar o PDF no campo de metadados"],"certas":[0],"porque":"Com a Files API você envia uma vez e referencia o ID. Os tokens do conteúdo ainda contam no contexto."},{"id":"apps-11","dominio":"apps","tipo":"unica","skill":"Claude Application Design","texto":"O app precisa de JSON que siga exatamente um schema. Qual é a opção mais robusta?","ops":["Structured outputs com o JSON Schema em `output_config.format`","Pedir \"responda apenas com JSON\" e usar regex","Prefill com `{` na última mensagem do assistant e parser tolerante","Temperatura zero com um exemplo no prompt"],"certas":[0],"porque":"Structured outputs restringe a geração ao schema, exceto em `refusal` ou `max_tokens`, que devem ser tratados. Prefill do último turno é rejeitado em modelos recentes."},{"id":"apps-12","dominio":"apps","tipo":"unica","skill":"Claude Application Design","texto":"Respostas precisam apontar o trecho exato do documento que as sustenta. O que usar?","ops":["Blocos `document` com citations habilitadas","Temperatura baixa e pedido de honestidade","Pergunta repetida até as respostas coincidirem","Um modelo maior sem enviar o documento"],"certas":[0],"porque":"Citations devolve trechos com localização. Também instrua o modelo a dizer quando a resposta não está na fonte."},{"id":"apps-13","dominio":"apps","tipo":"unica","skill":"Claude Application Design","texto":"Onde devem ficar papel e regras permanent ","O pedido não foi processado dentro de 24 horas"],"certas":[3],"porque":"Pedidos expirados não são cobrados; reenvie os que faltaram."},{"id":"apps-34","dominio":"apps","tipo":"unica","skill":"Claude API Mechanics","texto":"Em um batch, 3 de 10 mil pedidos retornam `errored` por entrada inválida. Qual é a ação?","ops":["Descartar os resultados dos dez mil","Repetir os três até que funcionem","Corrigir e reenviar só esses três","Reenviar o batch inteiro sem mudanças"],"certas":[2],"porque":"Cada pedido é independente. Entrada inválida não se resolve repetindo igual."},{"id":"apps-35","dominio":"apps","tipo":"multipla","skill":"Claude API Mechanics","texto":"Quais recursos **não** combinam com a Message Batches API? (Escolha 2)","ops":["System prompt","Streaming da resposta","Fast mode","Uso de tools"],"certas":[1,2],"porque":"Batch é assíncrono: não há stream nem modo rápido."},{"id":"apps-36","dominio":"apps","tipo":"unica","skill":"Claude API Mechanics","texto":"Um batch terminou há dois meses e o time quer baixar os resultados. O que esperar?","ops":["Podem não estar mais disponíveis para download","Ficam guardados para sempre na conta da empresa","São reenviados por e-mail ao abrir o painel","Precisam ser pagos novamente para o download"],"certas":[0],"porque":"A retenção é limitada (29 dias na documentação consultada). Guarde os resultados no seu sistema."},{"id":"apps-37","dominio":"apps","tipo":"unica","skill":"Claude API Mechanics","texto":"A API responde 404 `not_found_error` logo após uma mudança de configuração. O que verificar primeiro?","ops":["O saldo disponível de tokens por minuto","O tamanho em bytes do corpo enviado","O valor do header `retry-after`","O ID do modelo ou do recurso usado"],"certas":[3],"porque":"404 indica recurso inexistente, muitas vezes um ID digitado errado ou aposentado."},{"id":"apps-38","dominio":"apps","tipo":"unica","skill":"Claude API Mechanics","texto":"Diferença entre 401 e 403 na API:","ops":["401 é limite de uso; 403, servidor sobrecarregado","401 é pedido grande; 403, formato de JSON inválido","401 é credencial inválida; 403, falta de permissão","401 é falta de permissão; 403, credencial inválida"],"certas":[2],"porque":"Nenhum dos dois se resolve com retry."},{"id":"apps-39","dominio":"apps","tipo":"unica","skill":"Claude API Mechanics","texto":"Um cliente quer PDFs com **gráficos** analisados. O que é correto?","ops":["Colar o PDF em base64 dentro do texto","Enviar o PDF como bloco `document`","Extrair só o texto, pois imagens são ignoradas","Converter o PDF em áudio antes do envio"],"certas":[1],"porque":"O bloco `document` permite usar texto e conteúdo visual das páginas, dentro dos limites."},{"id":"apps-40","dominio":"apps","tipo":"unica","skill":"Claude API Mechanics","texto":"Uma conversa multi-turno via API ficou cara a cada mensagem. Qual é a causa estrutural?","ops":["O histórico inteiro é enviado de novo a cada turno","A API cobra uma taxa fixa por usuário conectado","O modelo reprocessa os turnos de outros clientes","O system prompt dobra de tamanho a cada resposta"],"certas":[0],"porque":"A API é stateless. Caching, compaction e janelas reduzem o custo."},{"id":"apps-41","dominio":"apps","tipo":"unica","skill":"Claude API Mechanics","texto":"Ao usar **citations** e `output_config.format` na mesma requisição, o que acontece?","ops":["As citações viram campos do JSON","O schema é ignorado em silêncio","A resposta sai em duas partes","A API rejeita com erro 400"],"certas":[3],"porque":"Os recursos são incompatíveis. Escolha um deles, separe em duas chamadas ou veja na documentação o padrão para dados estruturados com citações."},{"id":"apps-42","dominio":"apps","tipo":"multipla","skill":"Claude API Mechanics","texto":"Com structured outputs ativo, em quais casos a saída ainda pode **não** seguir o schema? (Escolha 2)","ops":["Uso de streaming","Prompt em português","Corte por `max_tokens`","Recusa do modelo"],"certas":[2,3],"porque":"Cheque o `stop_reason` antes de confiar no JSON."},{"id":"apps-43","dominio":"apps","tipo":"unica","skill":"Claude Application Design","texto":"Um chat mostra a resposta em streaming e o usuário clica em \"parar\". O que o backend deve fazer?","ops":["Enviar a mesma pergunta de novo, sem streaming","Cancelar a requisição e guardar o parcial marcado","Deixar o stream seguir e ocultar o restante dele","Apagar a conversa e iniciar uma outra sessão"],"certas":[1],"porque":"Cancelar poupa recursos; marcar como parcial evita tratá-lo como resposta completa."},{"id":"apps-44","dominio":"apps","tipo":"unica","skill":"Claude Application Design","texto":"O app atende 5 idiomas. Como decidir o idioma da resposta de forma previsível?","ops":["Regra no system prompt, com o idioma da conta","Deixar o modelo escolher a cada mensagem","Traduzir cada resposta para os cinco idiomas","Usar um modelo diferente para cada idioma"],"certas":[0],"porque":"Regra explícita e dado confiável da aplicação dão previsibilidade."},{"id":"apps-45","dominio":"apps","tipo":"unica","skill":"Claude Application Design","texto":"Um assistente jurídico deve mostrar de onde veio cada afirmação. Qual desenho é mais verificável?","ops":["Uma lista de links escrita pelo modelo de memória","Uma nota de confiança de zero a cem por frase","Um aviso de que a resposta pode conter erros","Citations ligadas ao trecho exibido ao usuário"],"certas":[3],"porque":"Citações estruturadas apontam para o documento fornecido; links de memória podem ser inventados."},{"id":"apps-46","dominio":"apps","tipo":"unica","skill":"Claude Application Design","texto":"Uma tela faz 4 chamadas ao modelo em sequência e demora 20 s. Duas não dependem das outras. O que fazer?","ops":["Aumentar o `max_tokens` de todas as chamadas","Repetir as chamadas mais lentas duas vezes","Paralelizar as independentes e mostrar parciais","Trocar as quatro chamadas por um batch noturno"],"certas":[2],"porque":"Ataque o caminho crítico e a latência percebida."},{"id":"apps-47","dominio":"apps","tipo":"unica","skill":"Configuration Management","texto":"Prompt, modelo e schema mudam juntos em um release. Como permitir rollback **seguro**?","ops":["Manter cada um em um painel editável à mão","Versioná-los como um conjunto e implantar juntos","Guardar só o prompt, pois o resto pouco importa","Anotar as mudanças em um documento do time"],"certas":[1],"porque":"A combinação testada é a unidade que deve voltar atrás."},{"id":"apps-48","dominio":"apps","tipo":"multipla","skill":"Configuration Management","texto":"Quais valores devem variar por **ambiente**, fora do código? (Escolha 2)","ops":["Credenciais de acesso","Limites de concorrência","A lógica de validação do JSON","O nome das funções internas"],"certas":[0,1],"porque":"Configuração por ambiente fica fora do código; segredos, em um secret manager."},{"id":"apps-49","dominio":"apps","tipo":"unica","skill":"Configuration Management","texto":"Um experimento com um novo prompt deve atingir 5% dos usuários e poder ser desligado na hora. O que usar?","ops":["Uma branch que o time publica à noite","Um aviso para os usuários recarregarem","Um segundo sistema com outro domínio","Feature flag com métricas por variante"],"certas":[3],"porque":"Flags separam o deploy da liberação e permitem comparação e desligamento imediato."},{"id":"apps-50","dominio":"apps","tipo":"unica","skill":"Systems Life Cycle","texto":"Antes de aposentar um modelo em uso, o fornecedor anuncia a data. Qual plano é adequado?","ops":["Trocar o ID direto em produção e observar","Copiar as respostas antigas para um cache","Rodar evals no substituto e migrar com folga","Esperar o último dia para evitar retrabalho"],"certas":[2],"porque":"Depreciação é evento previsto do ciclo de vida: inventário, eval, migração e rollback."},{"id":"apps-51","dominio":"apps","tipo":"unica","skill":"Systems Life Cycle","texto":"Em que fase devem surgir os critérios de aceite de um app com LLM?","ops":["Durante a troca do primeiro modelo","Nos requisitos, antes da construção","Depois do primeiro incidente grave","Na documentação final do projeto"],"certas":[1],"porque":"Critérios cedo orientam design e evals; tarde, viram racionalização."},{"id":"apps-52","dominio":"apps","tipo":"unica","skill":"Software Engineering Foundations","texto":"Um worker recebe SIGTERM no meio de uma chamada de 40 s. Qual comportamento é correto?","ops":["Parar de aceitar tarefas e concluir ou reenfileirar","Encerrar na hora, ignorando as tarefas em curso","Reiniciar a chamada do zero até ela terminar","Bloquear o sinal para nunca ser encerrado"],"certas":[0],"porque":"Graceful shutdown evita perda e duplicação de trabalho."},{"id":"apps-53","dominio":"apps","tipo":"unica","skill":"Software Engineering Foundations","texto":"Testes unitários de um app chamam a API real a cada commit: lentos e instáveis. O que fazer?","ops":["Remover os testes que dependem de respostas","Rodar os testes só uma vez por trimestre","Repetir cada teste até ele passar","Simular a API neles e deixar evals à parte"],"certas":[3],"porque":"Teste a lógica com dublês; meça a qualidade do modelo em evals separados."},{"id":"apps-54","dominio":"apps","tipo":"unica","skill":"Software Engineering Foundations","texto":"Claude gerou um PR de 2.000 linhas que passa nos testes. Qual é a prática adequada?","ops":["Aprovar, pedindo que Claude revise a si mesmo","Recusar sempre, por ter sido gerado por IA","Dividir e revisar como código de qualquer pessoa","Aprovar, já que os testes passaram sem nenhum erro"],"certas":[2],"porque":"Autoria não dispensa revisão; mudanças menores são revisáveis."},{"id":"apps-55","dominio":"apps","tipo":"unica","skill":"Understanding Requirements","texto":"O cliente pede \"respostas 100% corretas\". Como transformar em requisito útil?","ops":["Incluir a frase exata no system prompt","Definir meta medida e o que fazer ao errar","Prometer, desde que se use o maior modelo","Retirar o tema para não criar expectativas"],"certas":[1],"porque":"Combine limite aceitável por tipo de erro com verificação, abstenção e escalada."},{"id":"code-01","dominio":"code","tipo":"unica","skill":"Claude Code Operation","texto":"Onde colocar comandos de build e convenções que todo o time e o Claude Code devem conhecer?","ops":["No `CLAUDE.md` do projeto, versionado no git","No `~/.claude/CLAUDE.md` de um desenvolvedor","Em um hook que bloqueia toda edição","No histórico de uma sessão compartilhada"],"certas":[0],"porque":"O arquivo do projeto é compartilhado. O do diretório do usuário vale só para ele."},{"id":"code-02","dominio":"code","tipo":"unica","skill":"Claude Code Operation","texto":"Qual mecanismo é aplicado pelo harness, e não pelo modelo, para bloquear comandos como `rm -rf` no Claude Code?","ops":["Regra de permissão deny ou hook `PreToolUse`","Instrução enfática e detalhada no `CLAUDE.md`","Pedido no início de cada sessão","Skill de boas práticas no shell"],"certas":[0],"porque":"Permissões e hooks são aplicados pelo harness; instruções só orientam o modelo. Uma regra deny para `rm` não cobre variantes como `bash -c`: para garantia forte, use sandbox. O hook bloqueia com exit 2 ou decisão deny; exit 1 não bloqueia."},{"id":"code-03","dominio":"code","tipo":"unica","skill":"Claude Code Operation","texto":"O time quer rodar o Claude Code em um job de CI, sem interação. O que usar?","ops":["`claude -p` com formato de saída estruturado","`/compact` antes de cada commit","`/clear` em um loop no terminal","Uma sessão interativa mantida aberta no runner"],"certas":[0],"porque":"`-p` é o modo headless. `--output-format json` ou `stream-json` facilita a integração."},{"id":"code-04","dominio":"code","tipo":"unica","skill":"Claude Code Operation","texto":"Um procedimento de release de 200 linhas só é necessário às vezes. Onde ele deve ficar?","ops":["Em uma Skill, carregada quando for relevante","No `CLAUDE.md` raiz, carregado em toda sessão","Em um hook de início de sessão","Em um comentário no topo do código"],"certas":[0],"porque":"Skills usam progressive disclosure: descrição sempre visível, corpo só quando preciso."},{"id":"code-05","dominio":"code","tipo":"unica","skill":"Claude Code Operation","texto":"Você terminou uma tarefa e vai começar outra, sem relação, na mesma sessão. Qual comando usar?","ops":["`/clear`","`/compact`","`/init`","`/resume`"],"certas":[0],"porque":"`/clear` começa com contexto limpo. `/compact` é para continuar o mesmo trabalho com histórico resumido."},{"id":"code-06","dominio":"code","tipo":"unica","skill":"Claude Code Operation","texto":"O que `/init` faz em um repositório?","ops":["Analisa o código e gera um `CLAUDE.md` inicial","Cria um repositório git com a branch principal","Instala todos os plugins recomendados","Apaga as sessões antigas do projeto"],"certas":[0],"porque":"É o ponto de partida. Revise e mantenha enxuto."},{"id":"code-07","dominio":"code","tipo":"unica","skill":"Claude Code Operation","texto":"Como distribuir juntos skills, commands, agents, hooks e servidores MCP entre vários repositórios?","ops":["Empacotar tudo em um plugin","Copiar tudo em um único `CLAUDE.md`","Salvar uma sessão e compartilhá-la","Criar um subagent para cada repositório"],"certas":[0],"porque":"Plugins agrupam extensões em uma unidade versionada e instalável."},{"id":"code-08","dominio":"code","tipo":"unica","skill":"Claude Code Operation","texto":"Um desenvolvedor quer uma preferência só sua neste projeto, fora do git. Qual arquivo usar?","ops":["`.claude/settings.local.json`","`.claude/settings.json`","`~/.claude/settings.json`","`.mcp.json`"],"certas":[0],"porque":"`settings.local.json` é pessoal do projeto; `settings.json` é compartilhado; o do home vale em todos os projetos."},{"id":"code-09","dominio":"code","tipo":"multipla","skill":"Claude Code Operation","texto":"Quais situações pedem um **subagent** no Claude Code? (Escolha 2)","ops":["Explorar muitos arquivos sem poluir a conversa principal","Revisar com tools restritas e instruções próprias","Formatar sempre o arquivo após cada edição","Guardar a credencial do banco de dados"],"certas":[0,1],"porque":"Subagents isolam contexto e permissões. Formatar sempre é tarefa de hook; segredos não vão em agents."},{"id":"code-10","dominio":"code","tipo":"unica","skill":"Claude Code Operation","texto":"O `CLAUDE.md` chegou a 900 linhas e regras vêm sendo ignoradas. Qual é a melhor ação?","ops":["Enxugar e mover detalhes para rules com escopo e Skills","Duplicar as regras mais importantes no fim","Dividir em imports com `@`, todos carregados no início","Copiar o arquivo para cada subdiretório"],"certas":[0],"porque":"Contexto permanente compete por atenção. Mantenha só o que vale quase sempre."},{"id":"code-11","dominio":"code","tipo":"unica","skill":"Claude Code Operation","texto":"Um hook `PreToolUse` deve **barrar** um comando. Com qual código de saída ele bloqueia e devolve o motivo a Claude?","ops":["Qualquer código diferente de zero","Código 2, com o motivo no stderr","Código 1, com o motivo no stdout","Código 0, com o motivo no stderr"],"certas":[1],"porque":"Em eventos bloqueáveis, o código 2 impede a ação e mostra o stderr. O código 1, por padrão, é erro não bloqueante: a ação segue."},{"id":"code-12","dominio":"code","tipo":"unica","skill":"Claude Code Operation","texto":"Um time pôs em `PostToolUse` um hook que \"impede\" editar `prod.yml`, mas o arquivo continua mudando. Por quê?","ops":["O evento ocorre depois que a tool já rodou","O hook precisa ser escrito em JavaScript","Hooks não enxergam o nome dos arquivos","O evento só dispara para comandos de shell"],"certas":[0],"porque":"`PostToolUse` serve para reagir (formatar, testar). Para impedir, use `PreToolUse` ou uma regra deny."},{"id":"code-13","dominio":"code","tipo":"unica","skill":"Claude Code Operation","texto":"As permissões têm `allow: Bash(git push *)` e `deny: Bash(git *)`. O que acontece com `git push origin main`?","ops":["É permitido, pois a regra é mais específica","Pede confirmação, pois as regras conflitam","É permitido, pois allow foi listado antes","É negado, pois deny é avaliado primeiro"],"certas":[3],"porque":"A ordem é deny, ask, allow. A especificidade não muda isso."},{"id":"code-14","dominio":"code","tipo":"unica","skill":"Claude Code Operation","texto":"A empresa precisa de uma política do Claude Code que nenhum desenvolvedor possa sobrepor. Onde defini-la?","ops":["Em `~/.claude/settings.json`","No `CLAUDE.md` da raiz","Em managed settings","Em `.claude/settings.json`"],"certas":[2],"porque":"Managed settings têm a maior precedência. `CLAUDE.md` é contexto, não imposição."},{"id":"code-15","dominio":"code","tipo":"unica","skill":"Claude Code Operation","texto":"Regras de SQL só importam ao editar `db/**`. Como evitar que ocupem contexto nas outras tarefas?","ops":["Colocá-las no topo do `CLAUDE.md` de cada usuário","Regra em `.claude/rules` com `paths` no frontmatter","Um `@import` dessas regras no `CLAUDE.md` da raiz","Repeti-las na descrição de cada commit do time"],"certas":[1],"porque":"Regras com `paths` carregam quando arquivos correspondentes entram em cena. `@import` organiza, mas não economiza contexto."},{"id":"code-16","dominio":"code","tipo":"unica","skill":"Claude Code Operation","texto":"Após `/compact`, Claude Code esqueceu uma convenção. Qual é a causa mais provável?","ops":["Ela foi dita só na conversa, não no `CLAUDE.md`","O `CLAUDE.md` da raiz é apagado ao compactar","O `/compact` desativa as regras de permissão","O comando troca o modelo usado na sessão"],"certas":[0],"porque":"O `CLAUDE.md` da raiz é relido após compactar; instruções só de conversa podem se perder no resumo."},{"id":"code-17","dominio":"code","tipo":"unica","skill":"Claude Code Operation","texto":"Antes de uma mudança arriscada, você quer que Claude explore o código e proponha um caminho **sem editar**. O que usar?","ops":["Modo acceptEdits","`claude --continue`","Um hook `Stop`","Plan mode"],"certas":[3],"porque":"Em plan mode Claude lê e investiga, e apresenta um plano para aprovação."},{"id":"code-18","dominio":"code","tipo":"unica","skill":"Claude Code Operation","texto":"Um script precisa ler a resposta de `claude -p` como um único objeto com metadados da sessão. Qual opção usar?","ops":["`--output-format stream-json`","`--allowedTools json`","`--output-format json`","`--output-format text`"],"certas":[2],"porque":"`json` devolve um objeto; `stream-json` emite eventos conforme ocorrem."},{"id":"code-19","dominio":"code","tipo":"unica","skill":"Claude Code Operation","texto":"Um time usa `--allowedTools \"Read\"` achando que isso **proíbe** todo o resto. Qual é o efeito real?","ops":["Vale só para sessões interativas no terminal","Pré-aprova Read; o resto segue as permissões","Remove do modelo todas as outras ferramentas","Bloqueia qualquer leitura fora do projeto atual"],"certas":[1],"porque":"A opção é uma lista de aprovação automática. Para proibir, use deny ou remova a tool."},{"id":"code-20","dominio":"code","tipo":"unica","skill":"Claude Code Operation","texto":"Todo o time deve usar o mesmo servidor MCP neste repositório. Onde configurá-lo?","ops":["No `.mcp.json` da raiz, versionado","No `~/.claude.json` de cada pessoa","Em uma Skill com a URL do servidor","No `CLAUDE.md`, como instrução"],"certas":[0],"porque":"O escopo project fica em `.mcp.json` e vai no git. Local e user são pessoais."},{"id":"code-21","dominio":"code","tipo":"unica","skill":"Claude Code Operation","texto":"O `.mcp.json` precisa de um token diferente por pessoa, sem ir para o git. Qual é a forma adequada?","ops":["Gravar o token e pôr o arquivo no README","Codificar o token em base64 no arquivo","Pedir que Claude solicite o token no chat","Referenciar uma variável como `${CRM_TOKEN}`"],"certas":[3],"porque":"Variáveis de ambiente são expandidas na configuração; o segredo fica fora do repositório."},{"id":"code-22","dominio":"code","tipo":"unica","skill":"Claude Code Operation","texto":"Uma Skill de deploy **nunca** deve ser acionada por iniciativa do modelo, só por `/deploy`. O que configurar?","ops":["Uma descrição vazia no arquivo","Mover a Skill para o `CLAUDE.md`","`disable-model-invocation: true`","`allowed-tools: none`"],"certas":[2],"porque":"O campo impede a invocação automática e mantém o comando manual."},{"id":"code-23","dominio":"code","tipo":"unica","skill":"Claude Code Operation","texto":"Um subagent revisor não deve alterar arquivos. Qual configuração garante isso melhor?","ops":["Escolher um modelo menor para o subagent","Campo `tools` só com ferramentas de leitura","Pedir no prompt que ele não edite nada","Dar a ele o mesmo contexto do principal"],"certas":[1],"porque":"A lista de tools é aplicada pelo harness; o prompt é só orientação. Atenção: Bash também permite escrever."},{"id":"code-24","dominio":"code","tipo":"unica","skill":"Claude Code Operation","texto":"Por que checkpoints e `/rewind` não substituem o git?","ops":["Não cobrem tudo, como arquivos mudados só via Bash","Apagam o histórico de commits a cada restauração","Só funcionam em arquivos menores que 1 MB","Exigem uma branch separada para cada prompt"],"certas":[0],"porque":"Checkpoints rastreiam edições das file tools. Mudanças só por Bash ou externas podem ficar de fora."},{"id":"code-25","dominio":"code","tipo":"unica","skill":"Claude Code Operation","texto":"Um job de CI roda `claude -p` em PRs de **desconhecidos**. Qual risco considerar primeiro?","ops":["O modo `-p` sempre ignora a configuração do projeto","O PR fica privado até o fim da execução do job","O modo `-p` não consegue ler arquivos do repositório","O repositório pode trazer hooks e servidores MCP"],"certas":[3],"porque":"Sem isolamento, a configuração do projeto vale sem diálogo de confiança. Restrinja segredos e permissões; `--bare` ignora hooks, MCP e `CLAUDE.md`."},{"id":"eval-01","dominio":"eval","tipo":"unica","skill":"Evaluation Design","texto":"O que é um *golden set* em evals?","ops":["Casos representativos com resultados esperados confiáveis","As respostas mais longas que o modelo já gerou","Os prompts que consomem menos tokens de entrada","Uma amostra grande de produção sem resposta de referência"],"certas":[0],"porque":"É a referência para comparar versões. Deve incluir casos típicos e de borda."},{"id":"eval-02","dominio":"eval","tipo":"unica","skill":"Evaluation Design","texto":"Para medir se a classificação retornou um dos cinco rótulos corretos, qual grader escolher?","ops":["Comparação exata em código","LLM-as-judge com nota de 1 a 10","Revisão humana de todos os casos","Contagem de tokens da resposta"],"certas":[0],"porque":"Se o código decide, use código: rápido, barato e determinístico."},{"id":"eval-03","dominio":"eval","tipo":"unica","skill":"Evaluation Design","texto":"Como saber se um LLM-as-judge é confiável antes de usá-lo em escala?","ops":["Medir a concordância dele com avaliações humanas","Pedir ao judge uma nota de sua própria confiança","Verificar se as notas médias são altas","Usar o mesmo prompt do modelo avaliado"],"certas":[0],"porque":"Calibre com uma amostra rotulada por humanos; ajuste a rubrica onde houver divergência."},{"id":"eval-04","dominio":"eval","tipo":"unica","skill":"Evaluation Design","texto":"Uma mudança no prompt corrigiu um caso reportado. O que fazer antes do deploy?","ops":["Rodar a suíte de regressão completa","Testar de novo só o caso corrigido","Fazer o deploy e aguardar reclamações","Aumentar o effort por garantia"],"certas":[0],"porque":"Correções pontuais podem quebrar outros casos."},{"id":"eval-05","dominio":"eval","tipo":"unica","skill":"Debugging and Error Handling","texto":"O trace mostra `tool_use` com argumentos corretos, mas o `tool_result` traz dados do cliente errado. Onde está o problema?","ops":["Na implementação da tool ou na integração","Na escolha de argumentos feita pelo modelo","No limite de tokens da resposta","Na temperatura da geração"],"certas":[0],"porque":"O modelo pediu certo; a camada de integração devolveu errado. O trace localiza a origem."},{"id":"eval-06","dominio":"eval","tipo":"unica","skill":"Debugging and Error Handling","texto":"O trace mostra que o modelo chama `search_docs` quando deveria chamar `search_orders`. O que revisar primeiro?","ops":["Nomes e descrições das duas tools","Timeout do banco de pedidos","Política de retry do cliente HTTP","Permissões da API key utilizada"],"certas":[0],"porque":"Seleção errada de tool costuma vir de descrições vagas ou sobrepostas."},{"id":"eval-07","dominio":"eval","tipo":"ordem","skill":"Debugging and Error Handling","texto":"Ordene um processo saudável para tratar uma falha de produção.","ops":["Coletar o trace e reproduzir a falha","Isolar a causa entre integração e modelo","Adicionar o caso à suíte de evals","Aplicar uma mudança específica","Rodar a regressão e só então publicar"],"certas":[0,1,2,3,4],"porque":"Registrar o caso antes de corrigir prova que o teste falha e depois passa."},{"id":"eval-08","dominio":"eval","tipo":"unica","skill":"Evaluation Design","texto":"Um eval passou uma vez, mas o app falha de vez em quando com a mesma entrada. O que faltou?","ops":["Rodar várias tentativas por caso e medir a taxa","Usar um prompt diferente para cada caso testado","Remover os casos que variam muito","Reduzir a suíte para um único caso"],"certas":[0],"porque":"Saídas não são determinísticas. Uma tentativa esconde a taxa real de falha."},{"id":"eval-09","dominio":"eval","tipo":"multipla","skill":"Evaluation Design","texto":"Quais práticas evitam enganar a si mesmo com um eval? (Escolha 2)","ops":["Manter um conjunto de teste separado do usado para ajustar","Incluir casos de borda e entradas adversariais","Ajustar o prompt olhando as respostas do teste final","Manter só exemplos que o modelo já acerta"],"certas":[0,1],"porque":"Ajustar sobre o teste causa overfitting; só casos fáceis escondem regressões."},{"id":"eval-10","dominio":"eval","tipo":"unica","skill":"Debugging and Error Handling","texto":"Qual registro é o mais útil para depurar um agent em produção?","ops":["Trace com mensagens, tools, resultados, `stop_reason` e uso","Resposta final enviada ao usuário, com data e hora de entrega","Apenas o total mensal de tokens consumidos","Apenas o status HTTP de cada requisição"],"certas":[0],"porque":"Falhas de agents surgem no meio da trajetória. Registre-a, com os dados pessoais protegidos."},{"id":"eval-11","dominio":"eval","tipo":"unica","skill":"Debugging and Error Handling","texto":"A API responde 529 em um pico. Qual estratégia de recuperação é a mais adequada?","ops":["Backoff com jitter, limite de tentativas e fallback planejado","Correção do JSON Schema e reenvio imediato da mesma requisição","Nova API key para cada tentativa realizada","Redução do system prompt até o erro sumir"],"certas":[0],"porque":"529 indica sobrecarga temporária: não é defeito do pedido."},{"id":"eval-12","dominio":"eval","tipo":"unica","skill":"Debugging and Error Handling","texto":"Um Q&A com RAG erra o prazo de devolução. O trace mostra que o trecho certo **não** estava entre os recuperados. Onde atuar?","ops":["No modelo, trocando por um de maior capacidade","No prompt, pedindo mais precisão nas respostas","Na busca: chunking, índice ou consulta","Na interface, com um aviso de possível erro"],"certas":[2],"porque":"O modelo não pode usar o que não recebeu. Se o trecho certo estivesse lá, a investigação iria para o prompt ou o modelo."},{"id":"eval-13","dominio":"eval","tipo":"unica","skill":"Debugging and Error Handling","texto":"Um RAG tem recuperação e geração. Como medir para saber **qual das duas** piorou?","ops":["Avaliar cada etapa com métricas próprias","Usar só a nota final dada pelos usuários","Contar os tokens médios de cada resposta","Rodar o mesmo caso até a resposta acertar"],"certas":[0],"porque":"Métricas por etapa (o trecho certo veio? a resposta é fiel a ele?) localizam a regressão."},{"id":"eval-14","dominio":"eval","tipo":"unica","skill":"Evaluation Design","texto":"Qual é o primeiro passo ao criar evals para um app novo?","ops":["Gerar mil casos sintéticos com outro modelo","Comparar os preços de três modelos diferentes","Definir o que é sucesso em termos mensuráveis","Escolher a ferramenta que vai rodar os testes"],"certas":[2],"porque":"Sem critério de sucesso, nenhum número do eval ajuda a decidir."},{"id":"eval-15","dominio":"eval","tipo":"unica","skill":"Evaluation Design","texto":"De onde tirar os casos **mais valiosos** para um eval de um app já em produção?","ops":["De benchmarks públicos de uso geral","De falhas e pedidos reais, anonimizados","Dos exemplos que estão no system prompt","De perguntas que o modelo já acerta sempre"],"certas":[1],"porque":"Casos reais refletem a distribuição de uso. Exemplos do prompt contaminam a medida."},{"id":"eval-16","dominio":"eval","tipo":"unica","skill":"Evaluation Design","texto":"Um LLM-as-judge dá nota maior às respostas **mais longas**. Qual é a correção?","ops":["Rubrica por critério, calibrada com humanos","Usar o mesmo juiz com mais tokens de saída","Encurtar todas as respostas antes de julgar","Somar a nota do juiz ao tamanho do texto"],"certas":[0],"porque":"Viés de verbosidade é comum. Critérios específicos e calibração o expõem e reduzem."},{"id":"eval-17","dominio":"eval","tipo":"unica","skill":"Evaluation Design","texto":"Ao comparar duas respostas, o juiz prefere quase sempre a **primeira**. Como reduzir o viés?","ops":["Mostrar só a primeira das respostas","Pedir que ele seja imparcial, por favor","Aumentar o número de critérios","Julgar nas duas ordens e comparar"],"certas":[3],"porque":"Trocar a ordem revela viés de posição; inconsistências viram empate ou revisão."},{"id":"eval-18","dominio":"eval","tipo":"unica","skill":"Evaluation Design","texto":"Um eval de agent compara a sequência exata de tools com um gabarito e reprova soluções válidas. O que mudar?","ops":["Aceitar qualquer execução que termine sem erro","Remover tools até restar só um único caminho","Avaliar o resultado final e os limites violados","Ensinar ao agent a sequência exata do gabarito"],"certas":[2],"porque":"Há vários caminhos válidos. Avalie o estado final e regras que não podem ser quebradas."},{"id":"eval-19","dominio":"eval","tipo":"unica","skill":"Evaluation Design","texto":"O eval tem 12 casos; a versão B acertou 10 e a A, 9. O que concluir?","ops":["As duas são idênticas em qualidade real","Pouco: a diferença pode ser só variação","B é melhor e já pode ir para produção","A é melhor, pois errou em casos difíceis"],"certas":[1],"porque":"Amostra pequena e uma tentativa não separam melhora de ruído."},{"id":"eval-20","dominio":"eval","tipo":"unica","skill":"Evaluation Design","texto":"Um detector de fraude: 99% dos casos são legítimos e o modelo acerta 99% dizendo sempre \"legítimo\". Qual métrica expõe isso?","ops":["Recall da classe fraude","Acurácia sobre o total","Latência média por caso","Tokens por resposta"],"certas":[0],"porque":"Com classes desbalanceadas, a acurácia engana. Veja precisão e recall da classe rara."},{"id":"eval-21","dominio":"eval","tipo":"multipla","skill":"Evaluation Design","texto":"Quais graders são **determinísticos**? (Escolha 2)","ops":["Rodar testes unitários no código gerado","Um LLM avaliando o tom da resposta","Um revisor humano dando uma nota","Validar o JSON contra o schema"],"certas":[0,3],"porque":"Prefira código quando o critério permite; use LLM ou humano para o que é subjetivo."},{"id":"eval-22","dominio":"eval","tipo":"unica","skill":"Evaluation Design","texto":"A nota do eval subiu, mas as reclamações também. Qual hipótese investigar primeiro?","ops":["O modelo mudou a resposta por causa do horário","O eval precisa de uma meta de nota mais alta","Os casos do eval não representam o uso real","Os usuários estão usando o app de forma errada"],"certas":[2],"porque":"Um eval só vale se a distribuição e o grader refletem o que importa ao usuário."},{"id":"eval-23","dominio":"eval","tipo":"unica","skill":"Evaluation Design","texto":"Um test
